<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wang Tiling Laboratory</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Wang Tiling Lab</h1>
        <div class="header-controls">
            <div id="mission-status" class="mission-badge">NO SIGNAL</div>
            <div style="display:flex; align-items:center; gap:5px; margin-right: 10px;">
                <span style="font-size:0.8rem; color:#888;">Seed:</span>
                <input type="text" id="seed-input" class="control-input" value="" placeholder="Random">
                <button class="icon-btn" id="btn-random-seed" title="Randomize Seed">🎲</button>
            </div>
            <select id="tile-set-select" class="control-select">
                <option value="standard">Set: Standard</option>
                <option value="circuit">Set: Circuit (Logic)</option>
                <option value="terrain">Set: Terrain (Map)</option>
                <option value="aperiodic">Set: Aperiodic (Hard)</option>
            </select>
            <select id="theme-select" class="control-select">
                <option value="classic">View: Classic</option>
                <option value="pipes">View: Pipes</option>
                <option value="entropy">View: Entropy (Heatmap)</option>
                <option value="isometric">View: Isometric (2.5D)</option>
            </select>
            <button id="mission-btn" class="control-select">Mission: OFF</button>
            <button class="icon-btn" id="btn-save" title="Save State">💾</button>
            <button class="icon-btn" id="btn-load" title="Load State">📂</button>
            <input type="file" id="file-input" style="display:none">
            <button class="icon-btn" id="palette-btn" title="Toggle Tile Palette">🎨</button>
            <button class="icon-btn" id="btn-snapshot" title="Download Snapshot">📷</button>
            <div class="mode-switch">
                <button class="mode-btn active" id="mode-solver">AI Solver</button>
                <button class="mode-btn" id="mode-puzzle">Puzzle Mode</button>
            </div>
        </div>
    </header>

    <div class="main-layout">
        <div class="sidebar-left" id="sidebar-solver">
            <div class="stats-panel">
                <div class="stat-item">Backtracks: <span id="stat-backtracks">0</span></div>
                <div class="stat-item">Depth: <span id="stat-depth">0</span></div>
            </div>
            <div class="control-group">
                <span class="group-title">Configuration</span>
                <select id="algo-select" class="control-select" style="width:100%; margin-bottom: 8px;">
                    <option value="wfc">Entropy (WFC)</option>
                    <option value="linear">Linear Scan</option>
                </select>
                <select id="topology-select" class="control-select" style="width:100%; margin-bottom: 8px;">
                    <option value="plane">Topology: Flat</option>
                    <option value="torus">Topology: Infinite Torus</option>
                </select>
                <div class="slider-row" style="margin-top:10px;">
                    <span>Size: <span id="grid-size-val" style="color:#4a90e2">10</span>x<span id="grid-size-val2">10</span></span>
                    <input type="range" id="size-slider" min="5" max="100" value="10">
                </div>
            </div>
            <div class="control-group">
                <span class="group-title">Simulation Control</span>
                <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                    <button class="action-btn" id="btn-step-back" style="flex:1; margin:0;" title="Step Back">⏮</button>
                    <button class="action-btn primary" id="btn-play-pause" style="flex:2; margin:0;">Play ▶</button>
                    <button class="action-btn" id="btn-step" style="flex:1; margin:0;" title="Step Forward">⏭</button>
                </div>
                <button class="action-btn toggle-btn" id="btn-infinite">Infinite Loop: OFF</button>
                <button class="action-btn" id="btn-reset">Reset Grid</button>
            </div>
            <div class="control-group">
                <span class="group-title">
                    <span id="weights-title-text">Biome Weights</span>
                    <button class="icon-btn" style="width:20px; height:20px; font-size:0.8rem;" id="btn-reset-weights">↺</button>
                </span>
                <div id="biome-sliders" class="biome-slider-container"></div>
            </div>
            <div class="control-group">
                <span class="group-title">Speed</span>
                <div class="slider-row">
                    <span>Slow</span>
                    <input type="range" id="speed-slider" min="1" max="100" value="70">
                    <span>Fast</span>
                </div>
            </div>
            <div class="log-box" id="log-box">
                <div class="log-entry">Lab initialized.</div>
            </div>
        </div>

        <div class="canvas-area">
            <canvas id="tilingCanvas"></canvas>
            <div id="instruction-overlay" class="overlay-msg">Click a cell to select it</div>
        </div>

        <div class="sidebar-right hidden" id="sidebar-puzzle">
            <div class="palette-header">
                <span class="group-title">Tile Palette</span>
                <div style="font-size: 0.8rem; color: #888; margin-top: 5px;">Select a tile to place.<br>Invalid tiles are disabled.</div>
            </div>
            <div class="palette-grid" id="palette-container"></div>
        </div>
    </div>

    <!-- Modular JS Imports -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
